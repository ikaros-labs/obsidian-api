name: npm

# Publishes the package to npm when a version tag (v1.2.3) is pushed. The tag must match
# package.json. Provenance links the published tarball to this workflow run.
#
# Auth is npm trusted publishing (OIDC), no token. Setup (once): publish the first version by
# hand, then configure trusted publishing on npmjs.com for ikaros-labs/spall, workflow npm.yml.
# OIDC needs npm 11.5.1+, hence Node 24. No dependency cache: npm advises against it in release builds.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
      - run: npm ci            # also builds dist/ (prepare)
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
