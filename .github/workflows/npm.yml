name: npm

# Publishes the package to npm when a version tag (v1.2.3) is pushed. The tag must match
# package.json. Provenance links the published tarball to this workflow run.
#
# Setup (once): add an npm automation token as the repository secret NPM_TOKEN, or configure
# trusted publishing for this workflow on npmjs.com and drop NODE_AUTH_TOKEN.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
      - run: npm ci            # also builds dist/ (prepare)
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
