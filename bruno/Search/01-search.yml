info:
  name: Search notes
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/v1/search?q={{query}}&limit=10'
  params:
  - name: q
    value: '{{query}}'
    type: query
  - name: limit
    value: '10'
    type: query
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("status is 200", function () {
        expect(res.getStatus()).to.equal(200);
      });
      test("has results envelope", function () {
        expect(res.getBody()).to.have.property("results");
        expect(res.getBody()).to.have.property("total");
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  BM25 search. Every word must match (`match=all`, the default). Russian and English words are stemmed, so `принтеры` finds `принтер` and `notes` finds `note`.

  Each result has `score`, `matched` (the stemmed terms it matched) and a one-line `snippet`. Set `query` in the environment.
