info:
  name: Prefix query
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/v1/search?q=kicad*&fields=path,matched'
  params:
  - name: q
    value: kicad*
    type: query
  - name: fields
    value: path,matched
    type: query
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("status is 200", function () {
        expect(res.getStatus()).to.equal(200);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: A trailing `*` matches every indexed term that starts with the word or its stem (up to 50 terms). Useful for words the stemmer splits differently, e.g. `печа*` for печать/печатать.
