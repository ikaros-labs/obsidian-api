info:
  name: Get note outline
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/v1/notes/{{note}}'
  headers:
  - name: Accept
    value: application/vnd.vault.outline+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("status is 200", function () {
        expect(res.getStatus()).to.equal(200);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Returns the targets a PATCH can use: the headings tree, block ids and frontmatter keys.
