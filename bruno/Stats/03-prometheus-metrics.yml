info:
  name: Prometheus metrics
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/v1/stats/metrics'
  params: []
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("status is 200", function () {
        expect(res.getStatus()).to.equal(200);
      });
      test("is prometheus text", function () {
        expect(res.getHeader("content-type")).to.contain("text/plain");
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: 'Prometheus text format: `vault_notes`, `vault_notes_created{window}`, `vault_notes_modified{window}`, `vault_last_modified_timestamp_seconds`, `vault_folder_notes{counter,path}` and `vault_property_notes{counter,property,value}`.
  Scrape it with `authorization: { credentials: vlt_… }`.'
